name: Deploy chapter — Guardrails

# Child runner for compliance policy + guardrails (Ch 3).

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: validate
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, deploy]
        default: validate

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrails (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend deps
        working-directory: backend
        run: npm install
      - name: Policy + guardrail tests
        working-directory: backend
        run: node --test test/policy.test.js
      - name: Deploy (gated)
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          echo "Deploy Guardrails: content-safety + guardrail policy."
          echo " -> apply policy/ guardrails to the Foundry content filter (layered tuning + ticket path)."
          echo " -> verify policy/test-prompts.md (benign clinical passes; 'safe to discharge' blocked)."
