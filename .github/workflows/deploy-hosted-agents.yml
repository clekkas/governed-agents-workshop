name: Deploy chapter — Hosted agents

# Child runner for hosted agents + BYO registry (Ch 1).

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: validate
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [validate, deploy]
        default: validate

permissions:
  contents: read

jobs:
  hosted-agents:
    name: Hosted agents (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent-service deps
        working-directory: agent-service
        run: pip install -r requirements.txt
      - name: Manifest conformance
        working-directory: agent-service
        run: python tests/test_manifests.py
      - name: Deploy (gated)
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          echo "Deploy Hosted agents: build + roll the agent image."
          echo " -> az acr build (agent-service/Dockerfile); terraform apply rolls container_image_agent."
          echo " -> BYO registry: sample end-to-end only (not pre-staged)."
