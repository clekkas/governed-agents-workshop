      .small { fill: #d8f3ff; font-family: Consolas, 'Cascadia Code', monospace; font-size: 16px; }
      .label { fill: #9ee7ff; font-family: Consolas, 'Cascadia Code', monospace; font-size: 16px; font-weight: bold; }
      .arrow { stroke: #d8f3ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 6; }
      .blue { stroke: #60a5fa; }
      .teal { stroke: #2dd4bf; }
      .orange { stroke: #fbbf24; }
      .red { stroke: #f87171; }
      .green { stroke: #86efac; }
      .purple { stroke: #c084fc; }
