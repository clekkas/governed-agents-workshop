<text x="40" y="1110" font-family="Segoe UI, Arial" font-size="12.5" font-weight="800" fill="#0f172a">Flow</text>
<text x="40" y="1132" font-family="Segoe UI, Arial" font-size="11.5" fill="#475569">1  GitHub Actions dispatches a job; the self-hosted runner picks it up over its outbound connection (no inbound).</text>
<text x="40" y="1149" font-family="Segoe UI, Arial" font-size="11.5" fill="#475569">2  The workflow presents an OIDC token to Entra;  3  a matching federated credential exchanges it for a short-lived Azure token (no stored secret).</text>
<text x="40" y="1166" font-family="Segoe UI, Arial" font-size="11.5" fill="#475569">4  terraform init/plan reads+writes remote state over the private endpoint (the account has no public access);  5  plan (done) / apply (gated) manages the target infra.</text>
